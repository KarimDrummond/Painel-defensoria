<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Defensoria - Royal Edition</title>
    <style>
        :root {
            --primary: #1a2a6c;
            --accent: #27ae60;
            --gray-text: #7f8c8d;
            --card-radius: 25px;
            --btn-radius: 50px;
            --danger: #e74c3c;
            /* Cores Versão 1 */
            --color-reset: #f1c40f;
            --color-clear: #c0392b;
            --color-batch: #e74c3c;
            --color-add: #3498db;
        }

        /* Fundo Animado e Estilos Base */
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 40px 20px 300px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(-45deg, #002366, #2e004f, #004d40, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: fixed;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            z-index: -1;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(100px, 100px) rotate(360deg); }
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: -1;
        }

        h1 {
            font-size: 1.8rem;
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            font-weight: 800;
        }

        .name-config {
            margin-bottom: 35px;
            z-index: 1;
            width: 100%;
            max-width: 320px;
        }

        #userName {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--btn-radius);
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        #userName::placeholder { color: rgba(255, 255, 255, 0.7); }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
            z-index: 1;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--card-radius);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 320px;
            box-sizing: border-box;
            position: relative;
            cursor: grab;
            transition: transform 0.3s ease, background 0.3s ease, opacity 0.5s ease, filter 0.5s ease, border 0.3s ease;
            filter: blur(0px);
        }

        .card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 1); }
        .card.deleting-now { transform: scale(0); opacity: 0 !important; filter: blur(20px) !important; transition: all 0.75s ease !important; }
        .card.selected-for-delete { border: 2px solid var(--danger) !important; box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }

        .menu-dots {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--primary);
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            opacity: 0.5;
            transition: 0.2s;
        }
        .menu-dots:hover { opacity: 1; }

        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            text-align: center;
            padding-right: 20px;
        }

        .text-content {
            color: #5d6d7e;
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: center;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .copy-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--btn-radius);
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            text-transform: uppercase;
        }

        .copy-btn:hover { transform: scale(1.02); background-color: #219150; }
        .split-btn-group { display: flex; gap: 8px; }
        .split-btn { flex: 1; font-size: 0.7rem; }
        .copied { background: #3498db !important; }

        /* --- MENU RADIAL (FAB) --- */
        .fab-container {
            position: fixed;
            bottom: 40px;
            left: 40px;
            z-index: 1000;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab-container::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -25px;
            width: 110px;
            height: 110px;
            background: transparent;
            border-radius: 0 280px 0 0;
            z-index: -1;
            transition: width 0.4s, height 0.4s;
            pointer-events: none;
        }

        .fab-container:hover::after, .fab-container.selection-active::after { 
            width: 280px; height: 280px; pointer-events: auto; 
        }

        .fab-main {
            width: 96px; height: 96px; border-radius: 50%;
            background-color: var(--accent); border: none;
            box-shadow: 0 6px 30px rgba(0,0,0,0.3); z-index: 2;
            cursor: default; display: flex; align-items: center; justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fab-main svg { width: 38px; height: 38px; }

        .fab-sub {
            position: absolute;
            width: 72px; height: 72px; border-radius: 50%;
            color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: translate(0, 0) scale(0);
            transition: all 0.54s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1;
            border: none;
        }

        .fab-sub svg { width: 30px; height: 30px; fill: white; transition: transform 0.2s, opacity 0.2s; }
        
        .fab-text {
            position: absolute;
            font-size: 0.65rem;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            line-height: 1.2;
            padding: 6px;
            opacity: 0;
            transform: scale(0.6);
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: none;
        }

        /* Cores Específicas e Delays */
        .fab-sub:nth-child(1) { background-color: var(--color-reset); transition-delay: 0.15s; }
        .fab-sub:nth-child(2) { background-color: var(--color-clear); transition-delay: 0.10s; }
        .fab-sub:nth-child(3) { background-color: var(--color-batch); transition-delay: 0.05s; }
        .fab-sub:nth-child(4) { background-color: var(--color-add); transition-delay: 0s; }

        /* Animação de Piscar para o Botão de Excluir Ativo */
        .fab-sub.blinking-active {
            animation: pulseDelete 1s infinite steps(1, end) !important;
        }

        @keyframes pulseDelete {
            0%, 100% { background-color: var(--color-batch); color: white; }
            50% { background-color: white; color: var(--color-batch); }
        }
        
        /* Força a cor do SVG a acompanhar a inversão de cor da classe blinking-active */
        .fab-sub.blinking-active svg { fill: currentColor; }

        /* Abertura */
        .fab-container:hover .fab-sub:nth-child(1), .fab-container.selection-active .fab-sub:nth-child(1) { transform: translate(176px, 0) scale(1); opacity: 1; transition-delay: 0s; }
        .fab-container:hover .fab-sub:nth-child(2), .fab-container.selection-active .fab-sub:nth-child(2) { transform: translate(152px, -88px) scale(1); opacity: 1; transition-delay: 0.05s; }
        .fab-container:hover .fab-sub:nth-child(3), .fab-container.selection-active .fab-sub:nth-child(3) { transform: translate(88px, -152px) scale(1); opacity: 1; transition-delay: 0.10s; }
        .fab-container:hover .fab-sub:nth-child(4), .fab-container.selection-active .fab-sub:nth-child(4) { transform: translate(0, -176px) scale(1); opacity: 1; transition-delay: 0.15s; }

        /* Hovers Internos */
        .fab-container .fab-sub:hover:nth-child(1) { transform: translate(176px, 0) scale(1.4); z-index: 10; }
        .fab-container .fab-sub:hover:nth-child(2) { transform: translate(152px, -88px) scale(1.4); z-index: 10; }
        .fab-container .fab-sub:hover:nth-child(3) { transform: translate(88px, -152px) scale(1.4); z-index: 10; }
        .fab-container .fab-sub:hover:nth-child(4) { transform: translate(0, -176px) scale(1.4); z-index: 10; }

        .fab-sub:hover svg { opacity: 0; transform: scale(0); }
        .fab-sub:hover .fab-text { opacity: 1; transform: scale(1); pointer-events: auto; }

        .fab-container:has(.fab-sub:hover) .fab-sub:not(:hover):nth-child(1) { transform: translate(176px, 0) scale(0.75); opacity: 0.6; }
        .fab-container:has(.fab-sub:hover) .fab-sub:not(:hover):nth-child(2) { transform: translate(152px, -88px) scale(0.75); opacity: 0.6; }
        .fab-container:has(.fab-sub:hover) .fab-sub:not(:hover):nth-child(3) { transform: translate(88px, -152px) scale(0.75); opacity: 0.6; }
        .fab-container:has(.fab-sub:hover) .fab-sub:not(:hover):nth-child(4) { transform: translate(0, -176px) scale(0.75); opacity: 0.6; }

        .fab-container:hover .fab-main, .fab-container.selection-active .fab-main { transform: scale(1.05); }

        /* Toast de Exclusão */
        .delete-toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 200;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .delete-toast.active { top: 20px; }
        .toast-text { color: var(--primary); font-weight: 800; font-size: 0.9rem; }
        .progress-container { width: 100px; height: 6px; background: #eee; border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 100%; height: 100%; background: var(--accent); border-radius: 10px; }
        .toast-action-btn { border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; transition: 0.2s; }
        .confirm-delete-btn { background: var(--accent); color: white; }
        .cancel-delete-btn { background: var(--primary); color: white; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px);
            padding: 50px 40px;
            border-radius: 50px;
            width: 95%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.5);
            animation: modalScale 0.2s ease-out;
        }

        @keyframes modalScale { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header-text {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .modal-btn { padding: 20px; border-radius: var(--btn-radius); border: 1px solid rgba(0,0,0,0.05); background: white; color: var(--primary); cursor: pointer; font-weight: 700; font-size: 1rem; transition: 0.2s; }
        .modal-btn:hover { background: var(--primary); color: white; }

        .modal-actions {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            width: 100%;
            justify-content: center; 
        }
        .btn-cancel { background: rgba(231, 76, 60, 0.1) !important; color: var(--danger) !important; }
        .btn-cancel:hover { background: var(--danger) !important; color: white !important; }
        .btn-confirm { background: var(--accent) !important; color: white !important; }
        .btn-confirm:hover { background: #219150 !important; color: white !important; }

        .edit-area { display: none; flex-direction: column; gap: 15px; background: rgba(0,0,0,0.03); padding: 25px; border-radius: 30px; align-items: center; }
        .edit-area input, .edit-area textarea { width: 100%; padding: 15px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; text-align: center; background: white; }
        .edit-area textarea { resize: none; height: 200px; }

        .warning-text { color: var(--danger); font-size: 0.8rem; font-weight: 700; text-align: center; margin-top: 5px; }
        .sortable-ghost { opacity: 0.3; transform: scale(0.95); }

        @media (max-width: 600px) { .card { width: 100%; } .modal { padding: 30px 20px; } .delete-toast { width: 90%; flex-wrap: wrap; justify-content: center; gap: 10px; } }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="blob" style="width: 350px; height: 350px; top: -100px; left: -100px;"></div>
    <div class="blob" style="width: 250px; height: 250px; bottom: 0; right: -50px;"></div>

    <h1>Painel de Respostas</h1>

    <div class="name-config">
        <input type="text" id="userName" placeholder="Seu nome para a saudação..." oninput="saveName()">
    </div>

    <div class="grid-container" id="cardGrid"></div>

    <div class="fab-container" id="fabMenu">
        <button class="fab-sub" onclick="resetPainel()">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            <span class="fab-text">Resetar Cards</span>
        </button>
        <button class="fab-sub" onclick="limparPainel()">
            <svg viewBox="0 0 24 24"><path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12V5z"/></svg>
            <span class="fab-text">Limpar Cards</span>
        </button>
        <button class="fab-sub" id="btnBatchDelete" onclick="handleBatchDeleteAction()">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            <span class="fab-text">Apagar Cards</span>
        </button>
        <button class="fab-sub" onclick="openAddModal()">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <span class="fab-text">Adicionar Card</span>
        </button>
        <div class="fab-main">
            <svg viewBox="0 0 24 24" fill="white">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
        </div>
    </div>

    <div id="deleteToast" class="delete-toast">
        <span class="toast-text">Excluindo Cards...</span>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <button class="toast-action-btn cancel-delete-btn" onclick="cancelBatchDelete()">Cancelar</button>
        <button class="toast-action-btn confirm-delete-btn" onclick="confirmBatchDeleteImmediate()">Confirmar</button>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="btnModalCancel()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header-text" id="modalHeader">Adicionar Card</div>
            
            <button class="modal-btn" onclick="toggleEdit('editName')">Editar nome</button>
            <div id="editName" class="edit-area">
                <input type="text" id="inputEditName" oninput="liveUpdateName()">
            </div>
            
            <button class="modal-btn" onclick="toggleEdit('editContent')">Alterar conteúdo</button>
            <div id="editContent" class="edit-area">
                <textarea id="textEditContent" oninput="liveUpdateContent()"></textarea>
                <div id="saudacaoWarning" class="warning-text" style="display:none;">
                    ⚠️ ATENÇÃO: Alterar este texto desativa o preenchimento automático do nome!
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="btnModalCancel()">Cancelar</button>
                <button class="modal-btn btn-confirm" onclick="btnModalConfirm()">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <script>
        const defaultCards = [
            { id: 't1', title: 'Saudação', content: "Bom dia! Seja bem-vindo ao atendimento da Defensoria Pública do Estado de Execução Penal. Me chamo xxxxx e serei responsável pelo seu atendimento. Para agilizar seu atendimento preciso que informe as seguintes informações:\n\n1) nome do apenado\n2) CPF do apenado\n3) nome da mãe do apenado\n4) n° do processo se souber" },
            { id: 't2', title: 'Parentesco', content: "Qual seu grau de parentesco com o apenado?" },
            { id: 't3', title: 'Permanência', content: "ATENÇÃO! Precisamos que permaneça no atendimento até o encerramento, pois caso não haja interação em até 10 minutos, seu atendimento será finalizado." },
            { id: 't4', title: 'Documentos', type: 'doc', content: "Versão completa ou reduzida sem o item 3." },
            { id: 't5', title: 'Ausência', content: "Em razão da ausência de resposta, seu atendimento será encerrado hoje. Mas não se preocupe, você pode enviar nova mensagem de segunda a sexta, das 08h00 às 13h30, de preferência pelo horário da manhã, pois temos mais atendentes. Agradecemos seu contato!" },
            { id: 't6', title: 'Expediente', content: "Olá, devido ao fim do expediente, infelizmente não conseguiremos realizar seu atendimento no dia de hoje. Por gentileza, entre em contato novamente no próximo dia útil, de 08h às 14h. Obrigado!" },
            { id: 't7', title: 'Agendamento', content: "Verificamos em nossos registros que o retorno para o seu atendimento está agendado para o dia XX/XX/XXXX. Caso não tenha outra situação, peço que entre em contato apenas na data agendada para que possamos lhe passar mais informações sobre o pedido." },
            { id: 't8', title: 'Remição', content: "As atividades são juntadas aos autos continuamente pela SEAP e periodicamente são feitos os pedidos de remição, principalmente quando verifica-se que irá influenciar um direito imediato ou iminente da progressão de regime." },
            { id: 't9', title: 'Envio', content: "Nosso expediente encerra às 14h, caso não consiga enviar a documentação até esse horário, poderá entrar em contato no dia seguinte, de preferência pelo horário da manhã, pois temos mais atendentes à disposição." },
            { id: 't10', title: 'Ajuda', content: "Posso lhe ajudar em algo mais?" },
            { id: 't11', title: 'Finalização', type: 'final', content: "A Defensoria Pública do Estado do Amazonas agradece seu contato..." }
        ];

        let cardsData = JSON.parse(localStorage.getItem('painelCards')) || [...defaultCards];
        let currentEditingId = null;
        let deleteTimeout = null;
        let deleteProgressInterval = null;
        let selectionMode = false;
        let selectedIds = new Set();
        
        let isAddingMode = false;
        let tempNewCard = null;
        let cardBackup = null;

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            cardsData.forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card' + (selectedIds.has(card.id) ? ' selected-for-delete' : '');
                cardEl.dataset.id = card.id;
                cardEl.onclick = (e) => { if (selectionMode) { toggleCardSelection(card.id, cardEl); e.stopPropagation(); } };
                let actionHtml = (card.type === 'doc') ? 
                    `<div class="split-btn-group"><button class="copy-btn split-btn" onclick="copyDoc(true, this)">COMPLETO</button><button class="copy-btn split-btn" onclick="copyDoc(false, this)">SEM ITEM 3</button></div>` :
                    (card.type === 'final') ? 
                    `<div class="split-btn-group"><button class="copy-btn split-btn" onclick="copyFinal(true, this)">MANHÃ</button><button class="copy-btn split-btn" onclick="copyFinal(false, this)">TARDE</button></div>` :
                    `<button class="copy-btn" onclick="copy('${card.id}', this)">COPIAR</button>`;
                cardEl.innerHTML = `<button class="menu-dots" onclick="openModal('${card.id}', event)">⋮</button><div class="card-title">${card.title}</div><div class="text-content">${card.content}</div>${actionHtml}`;
                grid.appendChild(cardEl);
            });
            localStorage.setItem('painelCards', JSON.stringify(cardsData));
        }

        function toggleCardSelection(id, el) {
            if (selectedIds.has(id)) { selectedIds.delete(id); el.classList.remove('selected-for-delete'); }
            else { selectedIds.add(id); el.classList.add('selected-for-delete'); }
        }

        function handleBatchDeleteAction() {
            const fab = document.getElementById('fabMenu');
            const btnDelete = document.getElementById('btnBatchDelete');
            if (!selectionMode) {
                selectionMode = true;
                fab.classList.add('selection-active');
                btnDelete.classList.add('blinking-active'); // Ativa a piscagem
            } else {
                btnDelete.classList.remove('blinking-active'); // Desativa a piscagem
                if (selectedIds.size > 0) {
                    startBatchDeleteCountdown();
                } else {
                    renderCards();
                }
                selectionMode = false;
            }
        }

        function startBatchDeleteCountdown() {
            const toast = document.getElementById('deleteToast');
            const bar = document.getElementById('progressBar');
            toast.classList.add('active');
            selectedIds.forEach(id => {
                const cardEl = document.querySelector(`.card[data-id="${id}"]`);
                if (cardEl) {
                    cardEl.style.transition = "opacity 5s linear, filter 5s cubic-bezier(0.08, 0.82, 0.17, 1)";
                    cardEl.style.opacity = "0";
                    cardEl.style.filter = "blur(10px)";
                }
            });
            let progress = 100;
            bar.style.width = "100%";
            deleteProgressInterval = setInterval(() => { progress -= 2; bar.style.width = progress + "%"; }, 100);
            deleteTimeout = setTimeout(() => { executeFinalBatchDelete(); }, 4250);
        }

        function cancelBatchDelete() {
            clearTimeout(deleteTimeout);
            clearInterval(deleteProgressInterval);
            document.getElementById('deleteToast').classList.remove('active');
            
            // CORREÇÃO: Limpa as seleções e reseta os cards removendo as bordas vermelhas
            selectedIds.clear();
            selectionMode = false;
            document.getElementById('fabMenu').classList.remove('selection-active');
            document.getElementById('btnBatchDelete').classList.remove('blinking-active');
            renderCards();
        }

        function confirmBatchDeleteImmediate() {
            clearTimeout(deleteTimeout);
            clearInterval(deleteProgressInterval);
            executeFinalBatchDelete();
        }

        function executeFinalBatchDelete() {
            document.getElementById('deleteToast').classList.remove('active');
            selectedIds.forEach(id => {
                const cardEl = document.querySelector(`.card[data-id="${id}"]`);
                if (cardEl) cardEl.classList.add('deleting-now');
            });
            setTimeout(() => {
                cardsData = cardsData.filter(c => !selectedIds.has(c.id));
                selectedIds.clear();
                renderCards();
            }, 750);
        }

        function openAddModal() {
            isAddingMode = true;
            currentEditingId = null;
            cardBackup = null;
            tempNewCard = {
                id: 'custom_' + Date.now(),
                title: "Novo Modelo",
                content: "Escreva aqui a sua frase personalizada..."
            };
            document.getElementById('inputEditName').value = tempNewCard.title;
            document.getElementById('textEditContent').value = tempNewCard.content;
            document.querySelectorAll('.edit-area').forEach(el => el.style.display = 'none');
            document.getElementById('saudacaoWarning').style.display = 'none';
            document.getElementById('modalHeader').style.display = 'block';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function openModal(id, e) {
            e.stopPropagation();
            if (selectionMode) return;
            isAddingMode = false;
            currentEditingId = id;
            const card = cardsData.find(c => c.id === id);
            cardBackup = { ...card };
            document.getElementById('inputEditName').value = card.title;
            document.getElementById('textEditContent').value = card.content;
            document.querySelectorAll('.edit-area').forEach(el => el.style.display = 'none');
            document.getElementById('saudacaoWarning').style.display = (id === 't1') ? 'block' : 'none';
            document.getElementById('modalHeader').style.display = 'none';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function btnModalConfirm() {
            if (isAddingMode) {
                cardsData.push(tempNewCard);
                isAddingMode = false;
                renderCards();
            }
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function btnModalCancel() {
            if (isAddingMode) {
                isAddingMode = false;
                tempNewCard = null;
            } else if (cardBackup) {
                const card = cardsData.find(c => c.id === currentEditingId);
                if (card) {
                    card.title = cardBackup.title;
                    card.content = cardBackup.content;
                    renderCards();
                }
            }
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function toggleEdit(id) { const el = document.getElementById(id); el.style.display = el.style.display === 'flex' ? 'none' : 'flex'; }
        
        function liveUpdateName() { 
            const val = document.getElementById('inputEditName').value;
            if (isAddingMode) { tempNewCard.title = val; } 
            else { cardsData.find(c => c.id === currentEditingId).title = val; renderCards(); }
        }
        
        function liveUpdateContent() { 
            const val = document.getElementById('textEditContent').value;
            if (isAddingMode) { tempNewCard.content = val; } 
            else { cardsData.find(c => c.id === currentEditingId).content = val; renderCards(); }
        }

        /* Os resets e limpezas gerais também removem qualquer estado de piscagem residual */
        function resetPainel() {
            if(confirm("Deseja resetar todos os cards?")) {
                cardsData = JSON.parse(JSON.stringify(defaultCards));
                selectedIds.clear();
                selectionMode = false;
                document.getElementById('btnBatchDelete').classList.remove('blinking-active');
                renderCards();
            }
        }

        function limparPainel() {
            if(confirm("Deseja apagar todos os cards?")) {
                cardsData = [];
                selectedIds.clear();
                selectionMode = false;
                document.getElementById('btnBatchDelete').classList.remove('blinking-active');
                renderCards();
            }
        }

        function copy(id, btn) {
            if (selectionMode) return;
            const card = cardsData.find(c => c.id === id);
            let text = card.content;
            if (id === 't1') text = text.replace("xxxxx", document.getElementById('userName').value.trim() || "xxxxx");
            navigator.clipboard.writeText(text);
            feedback(btn);
        }

        function copyDoc(full, btn) {
            if (selectionMode) return;
            let text = "Precisamos confirmar sua identidade. Para isso, envie, por gentileza: \n\n1) foto frente e verso do seu documento de identificação com foto\n2) foto segurando o documento ao lado do rosto";
            if(full) text += "\n3) certidão de casamento ou declaração de união estável";
            navigator.clipboard.writeText(text);
            feedback(btn);
        }

        function copyFinal(isMorning, btn) {
            if (selectionMode) return;
            navigator.clipboard.writeText("A Defensoria Pública do Estado do Amazonas agradece seu contato, tenha uma " + (isMorning ? "bom dia." : "boa tarde."));
            feedback(btn);
        }

        function feedback(btn) {
            const original = btn.innerText;
            btn.innerText = "COPIADO!";
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = original; btn.classList.remove('copied'); }, 1000);
        }

        window.onload = function() {
            const savedName = localStorage.getItem('atendenteNome');
            if (savedName) document.getElementById('userName').value = savedName;
            const fabMenu = document.getElementById('fabMenu');
            fabMenu.addEventListener('mouseleave', function() { if (!selectionMode) this.classList.remove('selection-active'); });
            renderCards();
            new Sortable(document.getElementById('cardGrid'), {
                animation: 250,
                ghostClass: 'sortable-ghost',
                onEnd: () => {
                    const newOrder = Array.from(document.querySelectorAll('.card')).map(el => el.dataset.id);
                    cardsData = newOrder.map(id => cardsData.find(c => c.id === id));
                    localStorage.setItem('painelCards', JSON.stringify(cardsData));
                }
            });
        };
    </script>
</body>
</html>
